spring.application.name=animetoanime

spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=${A2A_REMOTE_USER}
spring.datasource.password=${A2A_REMOTE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.types-contibutor = false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true